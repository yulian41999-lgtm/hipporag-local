<p><p class="doc-A"><a name="No3"></a>为落实第八轮中美战略与经济对话成果，根据《中国人民银行与美国联邦储备委员会合作备忘录》,中国人民银行决定授权美国摩根大通银行(J.P.Morgan Chase Bank,N.A.)担任美国人民币业务清算行。</p>

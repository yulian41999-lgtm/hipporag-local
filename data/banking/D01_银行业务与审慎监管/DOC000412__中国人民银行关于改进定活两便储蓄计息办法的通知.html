<p><p class="doc-A"><a name="No1"></a>为进一步完善定活两便储蓄计算办法，现将中国人民银行《关于统一定活两便储蓄利率的通知》（〈８６〉银发字第７号文）中第一条和第二条规定的存期不满一个月的零头天数不计息的办法，改为按实存天数计付利息。其他各项，仍按原规定执行。不得擅自变动。本通知自文到之日起执行。对已支取的定活两便储蓄，不再补付利息。</p>

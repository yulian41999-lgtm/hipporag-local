<p></p><p class="promulgatesubtitle">沈银营发〔2004〕87号</p><p class="promulgatepopulation">人民银行各县（市）支行，各区、县（市）财政局、经贸发展局、劳动和社会保障局，沈阳市各国有独资商业银行、股份制商业银行、沈阳市商业银行、市农村信用社联合社：</p><p class="doc-A">为贯彻落实中国人民银行沈阳分行、辽宁省财政厅、辽宁省劳动和社会保障厅转发《关于进一步推进下岗失业人员小额担保贷款工作的通知识沈银发〔2004〕49号》精神，进一步推动我市下岗失业人员小额担保贷款发放工作，现对《<a target="_blank" class="contentlink" href="../document/show?collection=legislation&amp;aid=MTAwMDA4Mjc1MjY%3D&amp;language=中文">关于下发〈沈阳市下岗失业人员小额担保贷款管理办法〉的通知</a>》（沈银营发〔2003〕107号）作如下补充规定，请认真贯彻执行。执行中遇到问题，及时向有关部门反映。</p><p class="doc-A">...</p><p class="zw-downbg"></p>

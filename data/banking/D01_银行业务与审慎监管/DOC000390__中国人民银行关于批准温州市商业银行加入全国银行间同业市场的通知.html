<p><p class="promulgatepopulation">温州市商业银行：</p><p class="doc-A">现批准你行加入全国银行间同业市场，从事同业拆借、债券回购和现券买卖业务。你行最高拆入资金余额为1.4亿元，最高拆出资金余额为2.6亿元。请与全国银行间同业拆借中心和中央国债登记结算有限责任公司联系，做好债券托管和有关技术准备工作。</p><p class="doc-A">特此通知。</p><p class="promulgatedate">1999年4月7日</p>

<p><p class="doc-A"><a name="No1"></a>邮电部、中国人民银行１９８６年３月１０日联合签署的《关于开办邮政储蓄的协议》中有关邮政储蓄存款手续费率、利息支付、备用金等规定，三月底即将到期。目前，部、行双方正在商谈新的办法，拟将手续费改为利差。但具体办法尚须双方进一步协商，并进行认真的调查研究和测算。在新办法未商定前，仍按原协议规定执行。为稳定经济、稳定金融，各地应继续支持邮政储蓄发展。</p>

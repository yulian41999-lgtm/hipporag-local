<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>关于明确郴州市城市建设投资经营有限责任公司为市本级申请国家开发银行第四次贷款主体的通知</title></head><body><p class="zw-topbg"></p>
<div class="faguicon">
<p></p><p class="promulgatesubtitle">郴政办函〔2008〕186号</p><p class="doc-A">郴州市人民政府办公室</p><p class="doc-A">关于明确郴州市城市建设投资经营有限</p><p class="doc-A">责任公司为市本级申请国家开发银行</p><p class="promulgatetitle">第四次贷款主体的通知</p><p class="promulgatepopulation">各县市区人民政府，市政府各部门、直属机构、部门管理机构，中省驻郴各单位：</p><p class="doc-A">为做好我市开行贷款资金申贷、发放、管理工作，经市政府同意，确定郴州市城市建设投资经营有限责任公司（原市新世纪公司）为市本级向国家开发银行申请第四次县域经济7.82亿元贷款的主体，统一承担市本级统贷统还的经济责任和法律...</p><p class="zw-downbg"></p>
</div></body></html>

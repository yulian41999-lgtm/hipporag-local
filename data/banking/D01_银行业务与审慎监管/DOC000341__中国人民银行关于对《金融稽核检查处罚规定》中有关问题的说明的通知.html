<p class="promulgatepopulation">人民银行各省、自治区、直辖市分行，计划单列市分行：</p>
<p><p class="doc-A">人民银行总行和监察部以银发〔１９８９〕１３６号文下发了《<a target="_blank" class="contentlink" href="../document/show?collection=legislation&aid=MTAwMDAwMjM3NTk%3D&language=中文">金融稽核检查处罚规定</a>》，现就有关罚没款项的财务处理问题说明如下：</p><p class="doc-A">对处理违反金融法规问题中的罚息收入，包括占用或欠缴的准备金、超业务范围吸收存款或发放贷款的加息罚息（不含逾期贷款罚息），按银行营业外收入处理；没收的回扣、好处费、奖金应上交财政。</p>

<p><p class="promulgatetitle">外资银行开业前验收合格意见书</p><p class="promulgatesubtitle">青银监复〔2013〕220号</p><p class="promulgatepopulation">南洋商业银行（中国）有限公司青岛城阳支行筹备组：</p><p class="doc-A">你筹备组《关于对我行青岛城阳支行进行开业验收的申请》收悉。根据《<a target="_blank" class="contentlink" href="../document/show?collection=legislation&aid=MTAwMDExODM2OTc%3D&language=中文">中华人民共和国外资银行管理条例</a>》、《<a target="_blank" class="contentlink" href="../document/show?collection=legislation&aid=MTAwMDAwNzM1MjY%3D&language=中文">中华人民共和国外资银行管理条例实施细则</a>》等规定，我局对你支行进行了开业前验收。经现场核查，你支行筹建完毕，具备了开业条件，验收合格。</p><p class="promulgatedate">2013年10月16日</p>

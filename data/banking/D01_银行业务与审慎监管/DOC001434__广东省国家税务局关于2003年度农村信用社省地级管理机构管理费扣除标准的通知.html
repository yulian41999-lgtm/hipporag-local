<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>广东省国家税务局关于2003年度农村信用社省地级管理机构管理费扣除标准的通知</title></head><body><p class="zw-topbg"></p>
<div class="faguicon">




<p></p><p class="promulgatepopulation">广州、深圳、各地级市国家税务局：</p><p class="doc-A">近接中国银行业监督管理委员会广东监管局广东省信用合作办公室《关于核定2003年度广东省农村信用社省地两级管理部门管理费的请示》(广东信合办[2004]39号)。根据《<a target="_blank" class="contentlink" href="../document/show?collection=legislation&amp;aid=MTAwMDAyMTQ3NjY%3D&amp;language=中文">国家税务总局关于县以上农村信用社管理机构管理费提取标准的通知</a>》(国税函[2001]87号)，经审核，同意我省农村信用社省、地级管理机构在2003年度提取管理费17，421万元(详见附件)。农村信用社按规定标准上交的管理费，在计算企业所得税时准予税前扣除；超过规定标准上交的管理费，其超过部分应作纳税调整。</p><p class="doc-A">附件：2003年度农村信用社省地级管理机构管理费税前扣除标准(略)</p><p class="promulgatedate">2004年4月2日</p>

<p></p><p class="promulgatesubtitle">大政办发 [2005] 163号</p><p class="promulgatetitle">大连市人民政府办公厅关于成立大连市推进国有商业银行剥离不良贷款处置工作领导小组的通知</p><p class="promulgatepopulation">各区、市、县人民政府，市政府各委办局、各直属机构，各有关单位：</p><p class="doc-A">为加强对国有商业银行剥离不良贷款处置工作的组织领导，市政府决定成立大连市推进国有商业银行剥离不良贷款处置工作领导小组，其组成人员如下：</p><p class="doc-A">组  长：戴玉林  副市长</p><p class="doc-A">副组长：林  华  市政府副秘书长</p><p class="doc-A">曹  煦  市政府金融办主任</p><p class="doc-A">王  春  市国资委主任</p><p class="doc-A">成  员：刘一丁  市经委副主任</p><p class="doc-A">张国平  市财政局副局长</p><p class="doc-A">王晋良  市国土房屋局副局长</p><p class="doc-A">刘文贵  市地税局副局长</p><p class="doc-A">江  武  市工商局副局长</p><p class="doc-A">吴  ...</p><p class="zw-downbg"></p>
</div></body></html>

<p></p><p class="promulgatesubtitle">株审字〔2010〕1号</p><p class="doc-A">株洲市审计局关于全市2009年</p><p class="promulgatetitle">农村信用社行业审计工作考核结果通报</p><p class="promulgatepopulation">各县（市、区）审计局：</p><p class="doc-A">根据省审计厅的统一部署，全市审计机关开展了农村信用社2008年度资产负债损益情况审计。各县（市、区）审计局高度重视，认真组织实施，较好地完成了工作任务。按照《株洲市审计局2009年度农村信用社行业审计项目评比办法》的规定，市局对5个县（市、区）审计局实施该项工作的情况进行了综合考核，根据考核结果，攸县审计局、炎陵县审计局、茶陵县审计局被评为优胜单位，现予以通报。</p><p class="promulgatedate">二○一○年一...</p><p class="zw-downbg"></p>
